interface:
  display_name: "DevOps Observer"
  short_description: "Inspect servers, pipelines, deployments, and logs safely"
  default_prompt: "Use $devops-observer to inspect the current DevOps state and summarize risks."

dependencies:
  tools:
    - type: "mcp"
      value: "devops"
      description: "Self-hosted DevOps read-only and operation-request tools"
      transport: "streamable_http"
      url: "https://devops.local/mcp"

policy:
  allow_implicit_invocation: true
